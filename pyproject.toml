[project]
name = "aruba_sign_cli"
version = "0.1.0"
description = "Aruba firma client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
    "requests-toolbelt>=1.0.0",
]

[project.scripts]
aruba_sign_cli = "aruba_sign_cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
    "nuitka>=4.2.2",
]
